name: Release module package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test module
        run: yarn test

      - name: Build package
        run: yarn companion-module-build

      - name: Locate built package
        id: pkg
        run: |
          built=$(find . -maxdepth 1 -name '*.tgz' | head -n 1)
          if [ -z "$built" ]; then
            echo "No .tgz was produced by companion-module-build. Directory contents:"
            ls -la
            exit 1
          fi
          target="generic-filereader-${GITHUB_REF_NAME#v}.tgz"
          if [ "$built" != "./$target" ]; then
            mv "$built" "$target"
          fi
          echo "Built package: $target"
          echo "file=$target" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.file }}" \
            --prerelease --generate-notes
